<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>No Internet Connection | Casynus Studio</title>
  <link rel="icon" type="image/jpeg" href="/favicon.jpeg">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #011b6d;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    .offline-overlay {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #011b6d;
      overflow: hidden;
    }
    .ambient-glow {
      position: absolute;
      inset: 0;
      background-image: url('/no-wifi.png');
      background-size: cover;
      background-position: center;
      filter: blur(30px);
      opacity: 0.45;
      transform: scale(1.08);
      pointer-events: none;
    }
    .main-frame {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 1350px;
      max-height: 100vh;
      aspect-ratio: 1672 / 941;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
    }
    .illustration {
      position: absolute;
      inset: 0;
      background-image: url('/no-wifi.png');
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      pointer-events: none;
    }
    .action-container {
      position: relative;
      z-index: 20;
      margin-bottom: 6.5%;
    }
    .reload-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 44px;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: #001c6d;
      background-color: #ffffff;
      border: 2px solid #ffffff;
      border-radius: 9999px;
      cursor: pointer;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      outline: none;
      text-decoration: none;
    }
    .reload-button:hover {
      background-color: #001035;
      color: #ffffff;
      border-color: #002b80;
      box-shadow: 0 12px 28px rgba(0, 16, 53, 0.65);
      transform: translateY(-1px);
    }
    .reload-button:active {
      transform: scale(0.96);
    }
    .reload-button svg {
      width: 20px;
      height: 20px;
      transition: transform 0.35s ease;
    }
    .reload-button:hover svg {
      transform: rotate(180deg);
    }
    @media (max-width: 640px) {
      .main-frame {
        aspect-ratio: auto;
        height: 100%;
        justify-content: center;
        padding: 24px 16px;
      }
      .illustration {
        position: relative;
        width: 100%;
        max-width: 480px;
        aspect-ratio: 1672 / 941;
        background-size: contain;
      }
      .action-container {
        margin-top: 24px;
        margin-bottom: 0;
      }
      .reload-button {
        padding: 12px 36px;
        font-size: 15px;
      }
    }
  </style>
</head>
<body>
  <div class="offline-overlay" role="alertdialog" aria-modal="true" aria-label="No internet connection">
    <div class="ambient-glow" aria-hidden="true"></div>
    <div class="main-frame">
      <div class="illustration" aria-hidden="true"></div>
      <div class="action-container">
        <button id="reloadBtn" class="reload-button" type="button" aria-label="Reload page">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
            <path d="M3 3v5h5"/>
            <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
            <path d="M16 16h5v5"/>
          </svg>
          <span id="btnText">Reload</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    const reloadBtn = document.getElementById('reloadBtn');
    const btnText = document.getElementById('btnText');

    function tryReload() {
      if (btnText) btnText.textContent = 'Reloading...';
      if (reloadBtn) reloadBtn.style.opacity = '0.8';
      window.location.reload();
    }

    if (reloadBtn) {
      reloadBtn.addEventListener('click', tryReload);
    }

    // Auto-reload when internet connectivity is restored
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
